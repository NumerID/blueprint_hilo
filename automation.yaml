alias: Défi Hilo Préchauffe AM test
description: >-
  Gère la préchauffe Hilo du matin/Manages the AM pre-heat phase of a Hilo
  Challenge
triggers:
  - entity_id:
      - sensor.defi_hilo
    to: pre_heat
    trigger: state
  - at: "04:00:00"
    trigger: time
actions:
  - data:
      temperature: 15
    target:
      entity_id: climate.thermostat_salle_de_bain
    action: climate.set_temperature
  - metadata: {}
    data: {}
    target:
      entity_id: switch.prise_echangeur_d_air
    action: switch.turn_off
mode: single
